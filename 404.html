<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... - LowRen Car's</title>
    <script>
        // Handle routing untuk GitHub Pages
        const path = window.location.pathname;
        
        if (path === '/testingcuy/admin' || path === '/testingcuy/admin/') {
            // Redirect ke admin panel
            window.location.href = '/testingcuy/admin/index.html';
        } else if (path === '/testingcuy/' || path === '/testingcuy') {
            // Already on main page
            window.location.href = '/testingcuy/index.html';
        } else {
            // Redirect ke homepage untuk path lainnya
            window.location.href = '/testingcuy/index.html';
        }
    </script>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif;">
        <div style="text-align: center;">
            <h2>Redirecting...</h2>
            <p>Jika tidak redirect otomatis, <a href="/testingcuy/index.html">klik di sini</a></p>
        </div>
    </div>
</body>
</html>
